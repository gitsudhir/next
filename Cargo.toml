[package]
name = "next-rust-api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "time"] }
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
vercel_runtime = { version = "1" }
url = "2"
regex = "1"
rand = "0.8"

[[bin]]
name = "hello"
path = "api/hello.rs"

[[bin]]
name = "esp32_rust"
path = "api/esp32_rust.rs"

[[bin]]
name = "esp32_sensor"
path = "api/esp32_sensor.rs"

[[bin]]
name = "send_sensor_data"
path = "api/send_sensor_data.rs"

[[bin]]
name = "cars"
path = "api/cars.rs"